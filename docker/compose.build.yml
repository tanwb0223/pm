# ============================================================================
# 仅构建用：docker compose -f compose.build.yml build
#
# 生产运行时用 compose.yml + compose.tls.yml / compose.http.yml，不包含 build。
# 这样离线包里的 compose 不会去读源码目录，目标机只 docker load 镜像。
# ============================================================================

name: ${PM_PROJECT_NAME:-pm}-build

services:
  app:
    image: ${PM_IMAGE_NAME:-pm-app}:${PM_VERSION:-dev}
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PM_VERSION: ${PM_VERSION:-dev}
