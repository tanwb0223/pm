# 产教融合项目管理系统 · Docker Compose
#
# 只有两个容器：pm（应用，前端+后端同一进程）+ db（PostgreSQL）
#
# 用法：
#   cp .env.docker.example .env.docker     # 修改密码与密钥
#   docker compose up -d --build           # 构建并启动
#   docker compose logs -f pm              # 看日志
#
# 访问：http://服务器IP:8000
#
# 首次部署后初始化管理员：
#   docker compose exec pm python scripts/seed_admin.py admin '你的强密码'

services:
  # ================================================================ 应用
  pm:
    build:
      context: .
      dockerfile: Dockerfile
    image: pm:latest
    container_name: pm
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8000}:8000"
    environment:
      # ---------------------------------------------------------- 数据库
      PM_DATABASE_URL: postgresql+psycopg://${DB_USER:-pm_app}:${DB_PASSWORD:?必须在 .env.docker 设置 DB_PASSWORD}@db:5432/${DB_NAME:-pm_prod}
      # ---------------------------------------------------------- 应用
      PM_APP_NAME: ${PM_APP_NAME:-产教融合项目管理系统}
      PM_DEBUG: ${PM_DEBUG:-false}
      PM_SECRET_KEY: ${PM_SECRET_KEY:?必须在 .env.docker 设置 PM_SECRET_KEY}
      PM_ACCESS_TOKEN_EXPIRE_MINUTES: ${PM_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      PM_CORS_ORIGINS: ${PM_CORS_ORIGINS:-["http://localhost"]}
      # 前端由 FastAPI 托管（镜像内已内置 dist）
      PM_FRONTEND_SERVE: "true"
      PM_FRONTEND_DIR: /app/frontend_dist
      # ---------------------------------------------------------- 附件
      PM_UPLOAD_DIR: /data/upload
      PM_UPLOAD_MAX_SIZE_MB: ${PM_UPLOAD_MAX_SIZE_MB:-50}
      # ---------------------------------------------------------- 定时任务
      PM_SCHEDULER_ENABLED: ${PM_SCHEDULER_ENABLED:-true}
      PM_DAILY_SCAN_HOUR: ${PM_DAILY_SCAN_HOUR:-1}
      PM_DIGEST_HOUR: ${PM_DIGEST_HOUR:-8}
      PM_DIGEST_MINUTE: ${PM_DIGEST_MINUTE:-30}
      # ---------------------------------------------------------- 邮件
      PM_SMTP_HOST: ${PM_SMTP_HOST:-}
      PM_SMTP_PORT: ${PM_SMTP_PORT:-465}
      PM_SMTP_USER: ${PM_SMTP_USER:-}
      PM_SMTP_PASSWORD: ${PM_SMTP_PASSWORD:-}
      PM_SMTP_USE_SSL: ${PM_SMTP_USE_SSL:-true}
      PM_MAIL_FROM: ${PM_MAIL_FROM:-}
      TZ: Asia/Shanghai
    volumes:
      - upload:/data/upload
      - logs:/data/log
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - pm-net

  # ================================================================ 数据库
  db:
    image: postgres:16-alpine
    container_name: pm-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-pm_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?必须在 .env.docker 设置 DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-pm_prod}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      TZ: Asia/Shanghai
    volumes:
      - pgdata:/var/lib/postgresql/data
    # 默认不对外暴露；本地调试可取消注释
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-pm_app} -d ${DB_NAME:-pm_prod}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - pm-net

volumes:
  pgdata:
    name: pm-pgdata
  upload:
    name: pm-upload
  logs:
    name: pm-logs

networks:
  pm-net:
    name: pm-net
    driver: bridge
